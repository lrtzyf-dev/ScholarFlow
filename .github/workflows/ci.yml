name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend-focused:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -r backend/requirements.txt
      - run: >-
          python -m pytest -q
          backend/tests/test_audit_source_context.py
          backend/tests/test_citation_partial_delivery.py
          backend/tests/test_chat_events.py
          backend/tests/test_citation_delivery_diagnostics_current.py

  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm audit --audit-level=moderate
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm run test:markdown
        working-directory: frontend
      - run: node --experimental-strip-types --test tests/chatRunObserver.test.mjs
        working-directory: frontend
