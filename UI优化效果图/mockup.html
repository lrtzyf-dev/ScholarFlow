<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>研序 ScholarFlow · UI 优化效果图</title>
<style>
:root{
  --brand:#0a59f7; --brand-hover:#0948d6; --brand-light:#eef3ff;
  --bg:#f5f6f8; --card:#ffffff; --border:#e5e8ef; --border-strong:#d4d9e3;
  --text:#1d2129; --text-2:#4e5969; --text-3:#86909c; --text-4:#a9b2c0;
  --green:#00b42a; --green-bg:#e8ffea; --amber:#ff7d00; --amber-bg:#fff3e8;
  --purple:#7c3aed; --teal:#0d9488; --pink:#db2777;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06);
  --shadow-md:0 4px 12px rgba(16,24,40,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased}
.app{display:flex;height:100vh;overflow:hidden}

/* ===== Sidebar ===== */
.sidebar{width:220px;background:#fff;border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.sb-brand{display:flex;align-items:center;gap:10px;padding:16px 16px 14px}
.sb-logo{width:30px;height:30px;flex-shrink:0}
.sb-name{font-size:15px;font-weight:700;line-height:1.2}
.sb-sub{font-size:11px;color:var(--text-3);margin-top:1px}
.sb-nav{flex:1;overflow-y:auto;padding:6px 10px}
.sb-group{margin-bottom:6px}
.sb-group-head{display:flex;align-items:center;justify-content:space-between;padding:8px 10px 4px;font-size:11px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em;cursor:pointer}
.sb-item{display:flex;align-items:center;gap:10px;height:40px;padding:0 12px;border-radius:9px;color:var(--text-2);cursor:pointer;font-size:13.5px;position:relative}
.sb-item svg{width:16px;height:16px;flex-shrink:0;stroke-width:1.8}
.sb-item:hover{background:#f3f5f8;color:var(--text)}
.sb-item.active{background:var(--brand-light);color:var(--brand);font-weight:600}
.sb-foot{padding:10px;border-top:1px solid var(--border)}
.sb-collapse{display:flex;align-items:center;gap:8px;width:100%;height:34px;padding:0 12px;border:none;background:none;color:var(--text-3);cursor:pointer;font-size:13px;border-radius:8px}
.sb-collapse:hover{background:#f3f5f8}

/* ===== Main ===== */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative}
.view-toggle{position:fixed;bottom:14px;right:18px;z-index:50;display:flex;gap:4px;background:#fff;border:1px solid var(--border);border-radius:9px;padding:3px;box-shadow:var(--shadow-md)}
.vt{border:none;background:none;padding:5px 12px;font-size:12px;border-radius:7px;cursor:pointer;color:var(--text-2)}
.vt.active{background:var(--brand);color:#fff}
.content{flex:1;overflow-y:auto;padding:26px 32px}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px}
.page-title{font-size:22px;font-weight:700;letter-spacing:-.01em}
.page-desc{font-size:13px;color:var(--text-3);margin-top:6px}
.btn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 16px;border-radius:9px;font-size:13.5px;cursor:pointer;border:1px solid var(--border-strong);background:#fff;color:var(--text-2);font-weight:500}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.btn svg{width:15px;height:15px}
.btn-primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn-primary:hover{background:var(--brand-hover);color:#fff}
.btn-sm{height:30px;padding:0 12px;font-size:12.5px}

/* ===== Stats ===== */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.stat{background:#fff;border:1px solid var(--border);border-radius:12px;padding:15px 17px;box-shadow:var(--shadow)}
.stat-top{display:flex;align-items:center;justify-content:space-between}
.stat-label{font-size:12.5px;color:var(--text-3)}
.stat-ico{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center}
.stat-ico svg{width:16px;height:16px}
.stat-val{font-size:24px;font-weight:700;margin-top:8px;letter-spacing:-.02em}
.stat-trend{font-size:11.5px;margin-top:3px;color:var(--text-3)}

/* ===== Toolbar ===== */
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.search{flex:1;display:flex;align-items:center;gap:8px;height:38px;background:#fff;border:1px solid var(--border);border-radius:10px;padding:0 13px}
.search svg{width:16px;height:16px;color:var(--text-3);flex-shrink:0}
.search input{border:none;outline:none;flex:1;font-size:13.5px;background:transparent}
.select{display:flex;align-items:center;gap:6px;height:38px;background:#fff;border:1px solid var(--border);border-radius:10px;padding:0 12px;font-size:13px;color:var(--text-2);cursor:pointer}
.select svg{width:14px;height:14px;color:var(--text-3)}

/* ===== Paper grid ===== */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.paper{background:#fff;border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);transition:all .18s;cursor:pointer;display:flex;flex-direction:column}
.paper:hover{border-color:var(--brand);box-shadow:var(--shadow-md);transform:translateY(-2px)}
.paper-cover{height:88px;display:flex;align-items:center;justify-content:center;position:relative}
.paper-cover .doc{width:42px;height:42px;opacity:.92}
.paper-body{padding:14px 16px 15px;flex:1;display:flex;flex-direction:column}
.paper-title{font-size:14.5px;font-weight:600;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.paper-authors{font-size:12px;color:var(--text-3);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.paper-abstract{font-size:12.5px;color:var(--text-2);line-height:1.55;margin-top:9px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.paper-meta{display:flex;align-items:center;gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid var(--border);font-size:11.5px;color:var(--text-3)}
.paper-meta .dot{width:3px;height:3px;border-radius:50%;background:var(--text-4)}
.paper-actions{display:flex;gap:6px;margin-top:11px}
.pa{flex:1;height:30px;border:1px solid var(--border);background:#fff;border-radius:8px;font-size:12px;color:var(--text-2);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px}
.pa svg{width:13px;height:13px}
.pa:hover{border-color:var(--brand);color:var(--brand)}
.pa.primary{background:var(--brand-light);border-color:transparent;color:var(--brand);font-weight:600}
.pill{position:absolute;top:10px;right:10px;display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px}
.pill svg{width:11px;height:11px}
.pill.green{background:var(--green-bg);color:var(--green)}
.pill.amber{background:var(--amber-bg);color:var(--amber)}

/* ===== Graph ===== */
.graph-wrap{display:grid;grid-template-columns:1fr 320px;gap:16px;height:calc(100vh - 150px)}
.graph-canvas{background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.graph-canvas svg{width:100%;height:100%}
.gnode{cursor:pointer}
.gnode circle{fill:var(--brand);stroke:#fff;stroke-width:2.5;transition:all .15s}
.gnode:hover circle{fill:var(--brand-hover)}
.gnode.sel circle{fill:#0948d6;stroke:#bcd0ff;stroke-width:3}
.gnode.core circle{fill:#0948d6}
.gnode text{font-size:11.5px;fill:var(--text-2);text-anchor:middle;font-weight:500}
.gedge{fill:none;stroke:#b6bdc9;stroke-width:1.5}
.gedge.hl{stroke:var(--brand);stroke-width:2}
.gedge-arrow{fill:#b6bdc9}
.gedge-arrow.hl{fill:var(--brand)}
.graph-legend{position:absolute;bottom:14px;left:14px;background:#fff;border:1px solid var(--border);border-radius:10px;padding:10px 13px;box-shadow:var(--shadow);font-size:11.5px;color:var(--text-2)}
.gl-row{display:flex;align-items:center;gap:8px;margin-top:6px}
.gl-dot{width:11px;height:11px;border-radius:50%}
.graph-tools{position:absolute;top:12px;right:12px;display:flex;flex-direction:column;gap:6px}
.gt{width:34px;height:34px;border:1px solid var(--border);background:#fff;border-radius:9px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-2);box-shadow:var(--shadow)}
.gt:hover{color:var(--brand);border-color:var(--brand)}
.gt svg{width:16px;height:16px}
.gpanel{background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);overflow-y:auto}
.gp-head{padding:16px 17px;border-bottom:1px solid var(--border)}
.gp-kind{font-size:11px;color:var(--text-3);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.gp-title{font-size:15px;font-weight:700;margin-top:6px;line-height:1.4}
.gp-sec{padding:14px 17px;border-bottom:1px solid var(--border)}
.gp-sec h4{font-size:12px;color:var(--text-3);font-weight:600;margin-bottom:10px}
.gp-meta{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;color:var(--text-2)}
.gp-meta b{color:var(--text);font-weight:600}
.ref-item{display:flex;gap:9px;padding:9px 0;border-bottom:1px solid #f0f2f5;font-size:12.5px;line-height:1.5;color:var(--text-2)}
.ref-item:last-child{border-bottom:none}
.ref-num{width:19px;height:19px;border-radius:6px;background:var(--brand-light);color:var(--brand);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.ref-item.linked{color:var(--brand);font-weight:500}

/* ===== Chat ===== */
.chat-col{max-width:920px;margin:0 auto;display:flex;flex-direction:column;height:100%}
.turn{margin-bottom:26px}
.user-row{display:flex;justify-content:flex-end;margin-bottom:16px}
.user-bubble{max-width:78%;background:var(--brand);color:#fff;padding:11px 16px;border-radius:16px 16px 4px 16px;font-size:13.5px;line-height:1.6}
.assistant{background:#fff;border:1px solid var(--border);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow)}
.gate-badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 11px;border-radius:20px;background:var(--green-bg);color:var(--green);margin-bottom:13px}
.gate-badge svg{width:13px;height:13px}
.answer-text{font-size:14px;line-height:1.75;color:var(--text)}
.answer-text .cite-chip{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:18px;padding:0 5px;margin:0 2px;background:var(--brand-light);color:var(--brand);border-radius:6px;font-size:11px;font-weight:700;cursor:pointer;vertical-align:1px}
.answer-actions{display:flex;align-items:center;gap:4px;margin-top:15px;padding-top:13px;border-top:1px solid var(--border)}
.aa{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 11px;border:none;background:none;border-radius:8px;font-size:12.5px;color:var(--text-3);cursor:pointer}
.aa svg{width:14px;height:14px}
.aa:hover{background:#f3f5f8;color:var(--brand)}
.aa-latency{margin-left:auto;font-size:11.5px;color:var(--text-4)}
.evidence-mini{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.ev-card{border:1px solid var(--border);border-radius:11px;padding:12px 14px;cursor:pointer;transition:all .15s}
.ev-card:hover{border-color:var(--brand);background:#fafcff}
.ev-top{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--brand);margin-bottom:6px}
.ev-id{width:21px;height:21px;border-radius:6px;background:var(--brand-light);display:flex;align-items:center;justify-content:center;font-size:11px}
.ev-quote{font-size:12.5px;color:var(--text-2);line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ===== Settings ===== */
.set-tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:22px}
.set-tab{display:flex;align-items:center;gap:7px;padding:11px 16px;font-size:13.5px;color:var(--text-3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.set-tab svg{width:15px;height:15px}
.set-tab.active{color:var(--brand);font-weight:600;border-bottom-color:var(--brand)}
.set-card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:20px 22px;box-shadow:var(--shadow);margin-bottom:18px;max-width:860px}
.set-card h3{font-size:15px;font-weight:700}
.set-card .sub{font-size:12.5px;color:var(--text-3);margin-top:4px}
.presets{display:flex;gap:9px;margin:16px 0}
.preset{display:flex;align-items:center;gap:7px;height:38px;padding:0 15px;border:1px solid var(--border-strong);background:#fff;border-radius:10px;font-size:13px;color:var(--text-2);cursor:pointer}
.preset:hover{border-color:var(--brand);color:var(--brand)}
.preset.sel{border-color:var(--brand);background:var(--brand-light);color:var(--brand);font-weight:600}
.field{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center;margin-top:15px}
.field label{font-size:13px;color:var(--text-2)}
.field input{height:38px;border:1px solid var(--border-strong);border-radius:9px;padding:0 13px;font-size:13px;outline:none;width:100%}
.field input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(10,89,247,.1)}
.field-row{display:flex;gap:10px}
.conn-status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 11px;border-radius:20px}
.conn-status.ok{background:var(--green-bg);color:var(--green)}
.conn-status .pulse{width:7px;height:7px;border-radius:50%;background:currentColor}
.set-foot{display:flex;align-items:center;gap:12px;margin-top:6px}


</style>
</head>
<body>
<div class="app">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sb-brand">
      <svg class="sb-logo" viewBox="0 0 32 32" fill="none">
        <rect x="2" y="5" width="13" height="22" rx="2.5" fill="#0a59f7"/>
        <path d="M16 5.5c1.4-1 3.2-1.6 5-1.6 3.3 0 6 1.4 7 3v19c-1-1.6-3.7-2.6-7-2.6-1.8 0-3.6.6-5 1.6V5.5z" fill="#7aa2fa"/>
        <path d="M16 5.5v20" stroke="#fff" stroke-width="1.6"/>
      </svg>
      <div>
        <div class="sb-name">研序 ScholarFlow</div>
        <div class="sb-sub">全流程科研助手</div>
      </div>
    </div>
    <nav class="sb-nav">
      <div class="sb-group">
        <div class="sb-group-head">常用</div>
        <div class="sb-item" data-v="chat"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>问答工作台</div>
        <div class="sb-item active" data-v="library"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>文献库</div>
        <div class="sb-item" data-v="graph"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="6" cy="6" r="3"/><circle cx="18" cy="6" r="3"/><circle cx="12" cy="18" r="3"/><path d="M8.5 7.5l3 7.5M15.5 7.5l-3 7.5"/></svg>引用图谱</div>
      </div>
      <div class="sb-group">
        <div class="sb-group-head">管理</div>
        <div class="sb-item" data-v="settings"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>模型与设置</div>
      </div>
    </nav>
    <div class="sb-foot">
      <button class="sb-collapse"><svg width="15" height="15" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>收起侧栏</button>
    </div>
  </aside>

  <!-- Main -->
  <main class="main">
    <div class="view-toggle">
      <button class="vt" data-v="chat">问答工作台</button>
      <button class="vt active" data-v="library">文献库</button>
      <button class="vt" data-v="graph">引用图谱</button>
      <button class="vt" data-v="settings">设置</button>
    </div>

    <div class="content" id="content"></div>
  </main>
</div>
<script>
const ICON = {
  doc:'<svg class="doc" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>',
  clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>',
  book:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>',
  chat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>',
  share:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>',
};

const VIEWS = {};

// ===== LIBRARY =====
VIEWS.library = `
<div class="page-head">
  <div>
    <div class="page-title">文献库</div>
    <div class="page-desc">上传论文 PDF，自动完成解析、切块、全文索引与向量索引</div>
  </div>
  <div style="display:flex;gap:10px">
    <button class="btn">${ICON.book}加载示例论文</button>
    <button class="btn btn-primary">${ICON.doc}上传 PDF</button>
  </div>
</div>

<div class="stats">
  <div class="stat">
    <div class="stat-top"><div class="stat-label">文献总数</div>
      <div class="stat-ico" style="background:#eef3ff;color:#0a59f7">${ICON.book}</div></div>
    <div class="stat-val">12</div>
    <div class="stat-trend">本周新增 3 篇</div>
  </div>
  <div class="stat">
    <div class="stat-top"><div class="stat-label">总页数</div>
      <div class="stat-ico" style="background:#f0ebff;color:#7c3aed">${ICON.doc}</div></div>
    <div class="stat-val">186</div>
    <div class="stat-trend">平均每篇 15.5 页</div>
  </div>
  <div class="stat">
    <div class="stat-top"><div class="stat-label">已解析</div>
      <div class="stat-ico" style="background:#e8ffea;color:#00b42a">${ICON.check}</div></div>
    <div class="stat-val">11</div>
    <div class="stat-trend">1 篇解析中</div>
  </div>
  <div class="stat">
    <div class="stat-top"><div class="stat-label">引用连边</div>
      <div class="stat-ico" style="background:#e6faf6;color:#0d9488">${ICON.share}</div></div>
    <div class="stat-val">8</div>
    <div class="stat-trend">局域图谱已生成</div>
  </div>
</div>

function gnode(id,label,x,y,r,cls){
  return `<g class="gnode ${cls}" transform="translate(${x},${y})">
    <circle r="${r}"/>
    <text y="${r+17}">${label}</text>
  </g>`;
}
function gedge(x1,y1,x2,y2,hl){
  const dx=x2-x1, dy=y2-y1, L=Math.sqrt(dx*dx+dy*dy), ux=dx/L, uy=dy/L, gap=34;
  const sx=x1+ux*gap, sy=y1+uy*gap, tx=x2-ux*gap, ty=y2-uy*gap;
  const mx=(sx+tx)/2, my=(sy+ty)/2;
  const cx=mx+(-uy)*40, cy=my+(ux)*40;
  return `<path class="gedge ${hl?'hl':''}" d="M${sx},${sy} Q${cx},${cy} ${tx},${ty}" marker-end="url(#arrow${hl?'2':''})"/>`;
}

function paperCard(title, authors, abstract, tint, status){
  const cover = tint === 1 ? '#0a59f7' : tint;
  const pill = status==='green'
    ? `<span class="pill green">${ICON.check}已解析</span>`
    : `<span class="pill amber">${ICON.clock}解析中</span>`;
  return `
  <div class="paper">
    <div class="paper-cover" style="background:linear-gradient(135deg, ${cover}, ${cover}cc)">
      ${ICON.doc}${pill}
    </div>
    <div class="paper-body">
      <div class="paper-title">${title}</div>
      <div class="paper-authors">${authors}</div>
      <div class="paper-abstract">${abstract}</div>
      <div class="paper-meta">
        <span>${ICON.book} 12 页</span><span class="dot"></span>
        <span>10/27 导入</span>
      </div>
      <div class="paper-actions">
        <button class="pa primary">${ICON.book}阅读</button>
        <button class="pa">${ICON.chat}提问</button>
        <button class="pa">${ICON.share}图谱</button>
      </div>
    </div>
  </div>`;
}

// ===== Switcher =====
const content = document.getElementById('content');
function show(v){
  content.innerHTML = VIEWS[v];
  content.scrollTop = 0;
  document.querySelectorAll('.vt').forEach(b=>b.classList.toggle('active', b.dataset.v===v));
  document.querySelectorAll('.sb-item').forEach(b=>b.classList.toggle('active', b.dataset.v===v));
}
document.querySelectorAll('.vt').forEach(b=>b.addEventListener('click',()=>show(b.dataset.v)));
document.querySelectorAll('.sb-item').forEach(b=>b.addEventListener('click',()=>show(b.dataset.v)));
show('library');
</script>
